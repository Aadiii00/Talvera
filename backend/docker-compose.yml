version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://talvera:talvera_pass@db:5432/talvera
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - db
      - neo4j

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=talvera
      - POSTGRES_PASSWORD=talvera_pass
      - POSTGRES_DB=talvera
    ports:
      - "5432:5432"

  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
